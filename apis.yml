aid: zerotier
name: ZeroTier
description: ZeroTier, Inc. builds a software-defined networking (SDN) overlay that securely connects
  devices, servers, clouds, and networks anywhere in the world as if they were on the same local LAN,
  without the complexity of traditional VPNs, port forwarding, or firewall changes. The platform combines
  a peer-to-peer, end-to-end encrypted transport with a hosted control plane (ZeroTier Central) for network,
  member, organization, and access management. Developers automate ZeroTier through the hosted Central
  API (create and manage virtual networks, authorize members, set flow rules and IAM), the local ZeroTier
  One Service/Client API on each node, a Terraform provider, first-party client libraries, webhooks for
  real-time organization events, and a growing focus on post-quantum ("ZeroTier Quantum") secure networking.
