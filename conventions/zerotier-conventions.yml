  style: uri-path
  current: /api/v1
error_envelope:
  style: http-status-only
  notes: >-
    The Central API signals errors with HTTP status codes (400, 401, 403, 404) and does not define
    a structured problem+json error body in its OpenAPI. See errors/zerotier-problem-types.yml.
