  central_legacy: 'HTTP header Authorization: token <API_TOKEN>'
  service_local: 'HTTP header X-ZT1-Auth: <authtoken.secret> (local node, localhost:9993)'
  token_management: >-
    Service accounts (Essential+ plans) hold multiple API tokens with expiration dates; tokens are
    shown once at creation. Legacy per-user tokens are created on the my.zerotier.com Account page.
idempotency:
  supported: false
  notes: >-
    ZeroTier Central does not document a dedicated idempotency-key mechanism. Resource updates are
    performed with POST to a resource identified by its ID (e.g. POST /network/{networkID}),
    which is effectively last-write-wins / upsert-style rather than a client-supplied idempotency key.
pagination:
  supported: false
  notes: >-
    List endpoints (GET /network, GET /network/{id}/member, GET /org/{id}/user) return full
    arrays without documented cursor/offset pagination parameters in the OpenAPI.
identifiers:
  network_id: 16-hex-digit network ID (controller node ID + network number)
  member_id: 10-hex-digit ZeroTier node/address ID
  notes: IDs are opaque hexadecimal strings, not prefixed like some SaaS APIs.
